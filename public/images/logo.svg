<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Soft Glow Gradient -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8D2"/>
      <stop offset="35%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#A47432"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC08A"/>
      <stop offset="100%" stop-color="#C59247"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A359" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4A359" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="46" fill="url(#sunGlow)"/>

  <!-- Protective Caring Hands (Forming Lotus Base) -->
  <path d="M22 68C22 68 28 82 50 82C72 82 78 68 78 68C72 74 62 76 50 76C38 76 28 74 22 68Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M16 56C24 64 36 70 50 70C64 70 76 64 84 56C76 62 64 66 50 66C36 66 24 62 16 56Z" fill="url(#goldGrad)"/>

  <!-- Lotus Petals -->
  <!-- Center Main Petal (Mother & Baby Flame) -->
  <path d="M50 18C44 32 44 48 50 62C56 48 56 32 50 18Z" fill="url(#goldGrad)"/>
  
  <!-- Left Inner Petal -->
  <path d="M50 30C40 38 34 50 42 62C45 54 48 44 50 30Z" fill="url(#leafGrad)"/>
  <!-- Right Inner Petal -->
  <path d="M50 30C60 38 66 50 58 62C55 54 52 44 50 30Z" fill="url(#leafGrad)"/>

  <!-- Left Outer Petal -->
  <path d="M44 42C30 46 22 58 32 66C37 60 41 52 44 42Z" fill="url(#goldGrad)" opacity="0.85"/>
  <!-- Right Outer Petal -->
  <path d="M56 42C70 46 78 58 68 66C63 60 59 52 56 42Z" fill="url(#goldGrad)" opacity="0.85"/>

  <!-- Gentle Pearl/Droplet (Nourishing Milk Pearl) -->
  <circle cx="50" cy="46" r="3.5" fill="#FFFFFF" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.2))"/>
</svg>
